apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: flask-mongo-app
  labels:
    app: mongodb
type: Opaque
stringData:
  # Using stringData for clean management; K8s converts to base64 internally
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "password123"
  # Standard MongoDB connection string with root credentials and authentication source
  MONGODB_URI: "mongodb://admin:password123@mongodb-service:27017/flask_db?authSource=admin"
