apiVersion: v1
kind: Secret
metadata:
  name: flask-secret
  namespace: flask-mongo-app
  labels:
    app: flask-app
type: Opaque
stringData:
  MONGO_USERNAME: "admin"
  MONGO_PASSWORD: "password123"
  # Direct authenticated connection URI resolving via Kubernetes CoreDNS
  MONGODB_URI: "mongodb://admin:password123@mongodb-service.flask-mongo-app.svc.cluster.local:27017/flask_db?authSource=admin"
