apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: flask-mongo-app
  labels:
    app: flask-app
data:
  FLASK_ENV: "production"
  # Connecting using the Kubernetes internal DNS name of the MongoDB ClusterIP Service
  MONGO_HOST: "mongodb-service"
  MONGO_PORT: "27017"
  MONGO_DB: "flask_db"
  MONGO_AUTH_SOURCE: "admin"
