apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: flask-mongo-app
  labels:
    app: flask-app
spec:
  # NodePort exposes the service on each Node's IP at a static port (30005)
  # making it directly accessible from the local host machine outside the cluster.
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30005
    name: http
  selector:
    app: flask-app
